apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'
apply plugin: 'kotlin-kapt'
apply plugin: 'dagger.hilt.android.plugin'
apply plugin: 'com.github.kt3k.coveralls'
apply plugin: 'com.google.devtools.ksp' // ✅ Add this line

android {
    packagingOptions {
        resources {
            excludes += ['mozilla/public-suffix-list.txt',
                         'META-INF/DEPENDENCIES',
                         'META-INF/LICENSE',
                         'META-INF/LICENSE.txt',
                         'META-INF/license.txt',
                         'META-INF/NOTICE',
                         'META-INF/NOTICE.txt',
                         'META-INF/notice.txt',
                         'META-INF/ASL2.0',
                         'META-INF/*.kotlin_module']
        }
        jniLibs {
            useLegacyPackaging = true
        }
    }
    compileSdkVersion 35
    defaultConfig {
        minSdkVersion 28
        targetSdkVersion 35
        testInstrumentationRunner "util.TestRunner"
        javaCompileOptions {
            annotationProcessorOptions {
                arguments = [
                        "room.schemaLocation"  : "$projectDir/schemas".toString(),
                        "room.incremental"     : "true",
                        "room.expandProjection": "true"]
            }
        }
        ndk {
            abiFilters 'x86', 'x86_64', 'armeabi-v7a', 'arm64-v8a'
        }
    }
    buildTypes {
        debug {
            minifyEnabled true
            shrinkResources false
        }
        release {
            minifyEnabled true
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    dataBinding {
        enabled = true
    }
    buildFeatures {
        viewBinding true
    }
    testOptions {
        unitTests {
            includeAndroidResources = true
            returnDefaultValues = true
        }
    }
    splits {
        abi {
            enable true
            reset()
            include 'armeabi-v7a', 'arm64-v8a'
            universalApk false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8

        // ✅ Enable desugaring
        coreLibraryDesugaringEnabled true
    }
    kotlinOptions {
        jvmTarget = "1.8"
    }
    namespace 'com.avd'
    lint {
        abortOnError false
    }
    sourceSets {
        main {
            jniLibs.srcDirs = ['libs']
        }
    }
}

dependencies {
    //  Android support
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.fragment:fragment-ktx:1.8.7'
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.9.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.9.0'
    implementation('androidx.concurrent:concurrent-futures-ktx:1.2.0')
    // Testing
    testImplementation "junit:junit:4.13.2"
    testImplementation "org.mockito:mockito-core:5.12.0"
    testImplementation "com.nhaarman:mockito-kotlin:1.6.0"
    androidTestImplementation "org.mockito:mockito-android:5.12.0"
    androidTestImplementation "com.nhaarman:mockito-kotlin:1.6.0"
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
    androidTestImplementation 'androidx.test.espresso:espresso-intents:3.6.1'
    //  Kotlin - **UPDATED**
    implementation "org.jetbrains.kotlin:kotlin-stdlib:2.1.10" // Changed version
    //  Life cycle
    implementation 'androidx.lifecycle:lifecycle-common-java8:2.9.0'
    testImplementation 'androidx.arch.core:core-testing:2.2.0'
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.9.0"
    androidTestImplementation 'androidx.arch.core:core-testing:2.2.0'

    //  Room
    implementation('androidx.room:room-runtime:2.6.1')
    annotationProcessor('androidx.room:room-compiler:2.6.1')
    // To use Kotlin annotation processing tool (kapt)
    ksp('androidx.room:room-compiler:2.6.1')

    // optional - Kotlin Extensions and Coroutines support for Room
    implementation('androidx.room:room-ktx:2.6.1')

    // optional - RxJava3 support for Room
    implementation('androidx.room:room-rxjava3:2.6.1')

    // optional - Guava support for Room, including Optional and ListenableFuture
    implementation('androidx.room:room-guava:2.6.1')

    // optional - Test helpers
    testImplementation('androidx.room:room-testing:2.6.1')
    // OkHttp and Retrofit
    implementation "com.squareup.okhttp3:okhttp:4.11.0"
    implementation "com.squareup.okhttp3:logging-interceptor:4.11.0"
    implementation "com.squareup.retrofit2:retrofit:2.9.0"
    // implementation deps.retrofit.rxjava2
    implementation 'com.squareup.retrofit2:adapter-rxjava3:2.9.0'
    implementation "com.squareup.retrofit2:converter-gson:2.9.0"

    api 'io.reactivex.rxjava3:rxandroid:3.0.2'
    // Because RxAndroid releases are few and far between, it is recommended you also
    // explicitly depend on RxJava's latest version for bug fixes and new features.
    // (see https://github.com/ReactiveX/RxJava/releases for latest 3.x.x version)
    api 'io.reactivex.rxjava3:rxjava:3.1.8'
    implementation "com.intuit.sdp:sdp-android:1.1.1"

    //ssp
    implementation "com.intuit.ssp:ssp-android:1.1.0"


    implementation 'com.github.bumptech.glide:glide:4.16.0'

    ksp 'com.github.bumptech.glide:compiler:4.16.0'

    implementation('androidx.webkit:webkit:1.14.0')

    implementation 'androidx.core:core-ktx:1.12.0'

    implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.7.3'

    implementation 'org.jsoup:jsoup:1.18.1'

    implementation 'com.github.marlonlom:timeago:4.0.3'

    implementation("commons-io:commons-io:2.20.0")

    implementation 'commons-lang:commons-lang:2.6'


    implementation("com.google.guava:guava:33.3.1-android")
    implementation("com.google.dagger:hilt-android:2.56.2")
    ksp("com.google.dagger:hilt-android-compiler:2.56.2") // **UPDATED**
    ksp ("androidx.hilt:hilt-compiler:1.2.0")
    implementation ("androidx.hilt:hilt-work:1.2.0")
    // optional - RxJava2 support
    implementation('androidx.work:work-rxjava3:2.9.0')
    // optional - Test helpers
    androidTestImplementation('androidx.work:work-testing:2.9.0')
    // optional - Multiprocess support
    implementation 'androidx.work:work-multiprocess:2.9.0'
    implementation 'com.google.android.play:feature-delivery-ktx:2.1.0'
    ///singular
    api 'com.singular.sdk:singular_sdk:12.8.0'
    implementation 'com.fasterxml.jackson.core:jackson-annotations:2.11.1'
    //reflection
    api("org.jetbrains.kotlin:kotlin-reflect:2.0.20") // Changed version
    api "androidx.datastore:datastore-preferences:1.1.7"
    api platform('com.google.firebase:firebase-bom:33.14.0') // **UPDATED** - Crucial for Firebase versions

    // ✅ Enable desugaring
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
    api 'com.google.android.gms:play-services-analytics:18.1.1'
    api 'com.google.android.gms:play-services-ads-identifier:18.2.0'
    api 'com.google.android.gms:play-services-base:18.7.0'
    //  Updated version
    //  Firebase Libraries - Versions are managed by firebase-bom
    api 'com.google.firebase:firebase-analytics-ktx' // Removed explicit version
    api 'com.google.firebase:firebase-crashlytics-ktx' // Removed explicit version
    api 'com.google.firebase:firebase-crashlytics-ndk' // Removed explicit version
    api 'com.google.firebase:firebase-messaging-ktx' // Removed explicit version
    // Add the Firebase SDK for Remote Config
    api 'com.google.firebase:firebase-config-ktx' // Updated to KTX, removed explicit version
    api 'com.google.firebase:firebase-database-ktx' // Updated to KTX, removed explicit version
    // Google Mobile Ads SDK
    api 'com.google.android.gms:play-services-ads:24.3.0' // **UPDATED**
    // AppLovin Mediation Adapter
    api 'com.google.ads.mediation:applovin:13.2.0.1'
    api 'com.google.ads.mediation:facebook:6.20.0.0'
    api 'com.google.ads.mediation:vungle:7.5.0.0'
    api 'com.google.ads.mediation:mintegral:16.9.71.0'
    api 'com.google.ads.mediation:pangle:7.1.0.8.0'
    api 'com.google.ads.mediation:fyber:8.3.7.0'
    // api 'com.google.ads.mediation:fyber:8.2.6.0'
    api 'com.facebook.android:audience-network-sdk:6.20.0'
    api 'com.google.ads.mediation:inmobi:10.6.3.0'
    //shimmer
    api 'com.facebook.shimmer:shimmer:0.5.0'

    api 'com.facebook.android:facebook-core:16.3.0'
    api 'com.adjust.sdk:adjust-android:5.4.6'
}
kapt {
    correctErrorTypes true
}