plugins {
    id 'com.android.application'
    id 'kotlin-android'
    id 'kotlin-kapt'
    id 'dagger.hilt.android.plugin'
    id 'androidx.navigation.safeargs.kotlin'
    id 'org.jetbrains.kotlin.android'
    id 'kotlin-parcelize'
    id 'com.google.devtools.ksp' // ✅ Add this for KSP support
}

android {
    namespace 'com.video.avd'
    compileSdk 35
    android {
        packagingOptions {
            resources {
                excludes += [
                        "mozilla/public-suffix-list.txt",
                        "META-INF/DEPENDENCIES",
                        "META-INF/LICENSE",
                        "META-INF/LICENSE.txt",
                        "META-INF/license.txt",
                        "META-INF/NOTICE",
                        "META-INF/NOTICE",
                        "META-INF/NOTICE.txt",
                        "META-INF/notice.txt",
                        "META-INF/ASL2.0",
                        "META-INF/*.kotlin_module",
                        "/META-INF/{AL2.0,LGPL2.1}"
                ]
            }
            jniLibs {
                useLegacyPackaging = true
            }
        }
    }

    defaultConfig {
        applicationId "com.onetap.allvideo.downloader.hdvideoplayer"
        minSdk 28
        targetSdk 35
        versionCode 10
        versionName "1.1.0"
        multiDexEnabled true
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        setProperty("archivesBaseName", "VideoDownloaderBrowserHub-" + versionName)
        ndk {
            // Specifies the ABIs that your app supports.
            abiFilters 'armeabi-v7a', 'arm64-v8a'
        }
    }
