def ROOM_VERSION = '2.6.1'

dependencies {
    //youtube extractor module
    api project(path: ':downloader')
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'androidx.webkit:webkit:1.13.0'
    implementation project(':indicatorseekbar')
    implementation project(':opensubtitlesandroid')
    implementation 'androidx.activity:activity:1.8.2'
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
    implementation "com.google.android.material:material:1.12.0"
    implementation 'androidx.multidex:multidex:2.0.1'
    //fragment ktx
    implementation "androidx.fragment:fragment-ktx:1.8.7"
    // Kotlin 2.5.3
    implementation("androidx.navigation:navigation-fragment-ktx:2.5.3")
    implementation("androidx.navigation:navigation-ui-ktx:2.5.3")
    "androidx.navigation:navigation-safe-args-gradle-plugin:2.5.3"
    implementation 'androidx.work:work-runtime-ktx:2.9.0'
    //co-routines
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.7.1'
    //For ViewModel
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.9.0"
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.9.0'
    implementation "androidx.lifecycle:lifecycle-livedata-ktx:2.9.0"
    //hilt
    implementation("com.google.dagger:hilt-android:2.56.2")
    ksp("com.google.dagger:hilt-android-compiler:2.56.2")
    implementation 'androidx.core:core-ktx:1.10.1'
    //Glide
    implementation "com.github.bumptech.glide:glide:4.16.0"
    ksp "com.github.bumptech.glide:compiler:4.16.0"
    //easy permission
    implementation "pub.devrel:easypermissions:3.0.0"
    //sdp
    implementation "com.intuit.sdp:sdp-android:1.1.1"
    //ssp
    implementation "com.intuit.ssp:ssp-android:1.1.0"
    implementation 'com.google.code.gson:gson:2.11.0'

    implementation 'com.google.android.play:review-ktx:2.0.2'
    ///Billing 8.0
    implementation 'com.android.billingclient:billing-ktx:8.0.0'
    // Room components
    implementation "androidx.room:room-ktx:$ROOM_VERSION"
    ksp "androidx.room:room-compiler:$ROOM_VERSION"
    androidTestImplementation "androidx.room:room-testing:$ROOM_VERSION"
    //Material
    implementation 'com.google.android.material:material:1.12.0'
    //exo player
    implementation "androidx.media3:media3-exoplayer:1.4.1"
    implementation "androidx.media3:media3-exoplayer-dash:1.4.1"
    implementation "androidx.media3:media3-ui:1.4.1"
    implementation "androidx.media3:media3-session:1.4.1"
    implementation "androidx.media3:media3-exoplayer-hls:1.4.1"



    /// blurry
    implementation 'jp.wasabeef:blurry:4.0.1'
    //Indicator
    implementation("com.tbuonomo:dotsindicator:4.3")
    //Round corners image
    implementation "com.makeramen:roundedimageview:2.3.0"

    //file piker for subtitles
    implementation 'commons-io:commons-io:2.13.0'
    //equalizer
    implementation 'com.diogobernardino:williamchart:2.2'
    implementation 'com.h6ah4i.android.widget.verticalseekbar:verticalseekbar:0.7.0'

    ///lottie
    implementation 'com.airbnb.android:lottie:6.6.6'

    //file picker
    api 'com.github.hedzr:android-file-chooser:v1.2.0-final'

    implementation 'com.linkedin.android.litr:litr:1.5.7'

    //view_pager 2
    implementation "androidx.viewpager2:viewpager2:1.1.0"

    //for date time formatter
    implementation 'org.threeten:threetenbp:1.4.0'
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'

    //cast
    implementation 'androidx.mediarouter:mediarouter:1.7.0'
    implementation 'com.google.android.gms:play-services-cast-framework:22.1.0'

    implementation "androidx.room:room-rxjava2:$ROOM_VERSION"
    ksp "androidx.room:room-compiler:$ROOM_VERSION"

    implementation 'com.github.f0ris.sweetalert:library:1.5.1'
    implementation 'de.hdodenhof:circleimageview:3.1.0'

    api "com.squareup.okhttp3:okhttp:4.12.0"
    ////Swipe to refresh
    implementation "androidx.swiperefreshlayout:swiperefreshlayout:1.1.0"

    //One Signal
//    implementation 'com.onesignal:OneSignal:4.8.10'

    //picasso
    implementation 'com.squareup.picasso:picasso:2.71828'
    //round progressbar
    implementation 'com.akexorcist:round-corner-progress-bar:2.2.1'
    implementation 'org.jsoup:jsoup:1.18.1'
    implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.7.3'
    ksp("androidx.hilt:hilt-compiler:1.2.0")
    implementation("androidx.hilt:hilt-work:1.2.0")

//  import the Kotlin extensions library for Play Feature Delivery
    implementation("com.google.android.play:feature-delivery-ktx:2.1.0")
    // circle image view
    implementation 'de.hdodenhof:circleimageview:3.1.0'
}

